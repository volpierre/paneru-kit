# Paneru config generated by paneru-kit 0.1.0 (preset: minimal).
# Re-run ./setup.sh to change it, or edit by hand: Paneru reloads this file on save.
# Every option: https://github.com/karinushka/paneru/blob/main/CONFIGURATION.md

[options]
focus_follows_mouse = false
mouse_follows_focus = false
# Widths that "resize" cycles through: quarter, third, half, two-thirds, three-quarters, full.
preset_column_widths = [0.25, 0.3333, 0.5, 0.6667, 0.75, 1.0]
# Ease-out speed: a 1000 px move settles in about ln(1000)/speed seconds.
animation_speed = 20

[padding]
top = 8
bottom = 8
left = 8
right = 8

[swipe]
sensitivity = 0.35
continuous = false

# Hold these keys and scroll (two fingers or a mouse wheel) to slide the strip.
[swipe.scroll]
modifier = "alt"

# 3-finger left/right swipe slides the strip. Up/down swipes stay with macOS.
[swipe.gesture]
fingers_count = 3
direction = "Natural"
vertical = false

[bindings]
# Move focus along the strip
window_focus_west  = "ctrl + alt - leftarrow"
window_focus_east  = "ctrl + alt - rightarrow"
window_focus_north = "ctrl + alt - uparrow"
window_focus_south = "ctrl + alt - downarrow"
window_focus_first = "ctrl + alt - home"
window_focus_last  = "ctrl + alt - end"

# Move the focused window along the strip
window_swap_west  = "ctrl + alt + shift - leftarrow"
window_swap_east  = "ctrl + alt + shift - rightarrow"
window_swap_north = "ctrl + alt + shift - uparrow"
window_swap_south = "ctrl + alt + shift - downarrow"
window_swap_first = "ctrl + alt + shift - home"
window_swap_last  = "ctrl + alt + shift - end"

# Widths
window_resize    = "ctrl + alt - r"
window_shrink    = "ctrl + alt + shift - r"
window_fullwidth = "ctrl + alt - f"
window_center    = "ctrl + alt - c"
window_balance   = "ctrl + alt - b"

# Displays, floating, misc
window_nextdisplay = "ctrl + alt - n"
window_manage      = "ctrl + alt + shift - f"
window_copyrule    = "ctrl + alt + shift - c"

# New windows open at this width in one step, before joining the strip, instead of
# opening at the app's size and then animating. Rules merge per setting, so this only
# supplies the width.
[windows.default_width]
title = ".*"
width = 0.5

# Save / Open pop-ups that some apps open as normal windows (e.g. Telegram) float.
[windows.file_dialogs]
title = '(?i)^(save|save as|open|export|import|choose|choose file|choose folder|enter name of file to save to.*|file upload|salva|salva come|salva con nome|apri|esporta|importa|scegli|inserire il nome del file da salvare.*|caricamento file|speichern|speichern unter|sichern|öffnen|exportieren|importieren|auswählen|enregistrer|enregistrer sous|ouvrir|exporter|importer|choisir|guardar|guardar como|abrir|exportar|importar|elegir|seleccionar)$'
floating = true

[windows.force_net_whatsapp_whatsapp]
title = ".*"
bundle_id = "net.whatsapp.WhatsApp"
manage = true

[windows.float_com_apple_calculator]
title = ".*"
bundle_id = "com.apple.calculator"
floating = true

[windows.float_com_apple_systempreferences]
title = ".*"
bundle_id = "com.apple.systempreferences"
floating = true
